name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # E2E용 임시 값. 실제 GitHub·Claude는 부르지 않는다 (경력기술서 생성은 RESUME_MOCK=1).
      APP_URL: http://localhost:3000
      GITHUB_APP_CLIENT_ID: ci-client-id
      GITHUB_APP_CLIENT_SECRET: ci-client-secret
      GITHUB_APP_SLUG: ci-app
      RESUME_MOCK: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 세션 암호화 키 생성
        run: echo "SESSION_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")" >> "$GITHUB_ENV"
      - run: npm run lint
      # PageProps 같은 라우트 타입은 .next/types에 생성되는 파일이라 먼저 만든다.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
